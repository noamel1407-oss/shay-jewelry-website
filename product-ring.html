<script type="module">
import { mountRingViewer } from './ring-viewer.js';

const titles = {
  '1': 'טבעת סוליטר יהלום',
  '2': 'טבעת איטרניטי יהלומים',
  '3': 'סט טבעות יהלומים',
  '4': 'טבעת איטרניטי',
};
const id = new URLSearchParams(location.search).get('item') || '1';

if (titleEl && titles[id]) titleEl.textContent = titles[id];
document.title = (titles[id] || 'צפייה בפריט') + ' | SHAY JEWELRY';

mountRingViewer(document.getElementById('ring-canvas'), {

  barEl: document.getElementById('ring-loading-bar'),
});
</script>
